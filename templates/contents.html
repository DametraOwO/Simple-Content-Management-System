<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='AdminLTE-3.2.0/dist/css/adminlte.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='AdminLTE-3.2.0/plugins/fontawesome-free/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    {% include 'sidebar.html' %}
    <div class="content-wrapper page-content" style="margin-left: 250px;">
        <section class="content pt-4">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-md-4">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search...">
                    </div>
                    <div class="col-md-4">
                        <select id="platformFilter" class="form-control">
                            <option value="">All Platforms</option>
                            <option value="Blog">Blog</option>
                            <option value="Science">Science</option>
                            <option value="Lifestyle">Lifestyle</option>
                            <option value="History">History</option>
                            <option value="Art">Art</option>
                            <option value="Food">Food</option>
                            <option value="Nature">Nature</option>
                            <option value="Technology">Technology</option>
                            <option value="Games">Games</option>
                            <option value="Travel">Travel</option>
                            <option value="Photography">Photography</option>
                            <option value="Health">Health</option>
                            <option value="DIY">DIY</option>
                            <option value="Wellness">Wellness</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select id="statusFilter" class="form-control">
                            <option value="">All Status</option>
                            <option value="Published">Published</option>
                            <option value="Draft">Draft</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <div class="card animate-item">
                            <div class="card-header">
                                <h3 class="card-title">Contents</h3>
                                <div class="card-tools">
                                    <a href="{{ url_for('create_content') }}" class="btn btn-primary btn-sm">
                                        <i class="fas fa-plus"></i> Add Content
                                    </a>
                                    <button class="btn btn-secondary btn-sm" onclick="generateDummy()">
                                        <i class="fas fa-plus"></i> Generate Dummy
                                    </button>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Title</th>
                                            <th>Platform</th>
                                            <th>Status</th>
                                            <th>Date</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for content in contents %}
                                        <tr class="animate-item">
                                            <td>{{ content.title }}</td>
                                            <td>{{ content.platform }}</td>
                                            <td><span class="badge badge-{{ 'success' if content.status == 'Published' else 'warning' if content.status == 'Draft' else 'danger' }}">{{ content.status }}</span></td>
                                            <td>{{ content.date }}</td>
                                            <td>
                                                <a href="{{ url_for('view_content', id=content.id) }}" class="btn btn-xs btn-info"><i class="fas fa-eye"></i></a>
                                                <a href="{{ url_for('edit_content', id=content.id) }}" class="btn btn-xs btn-warning"><i class="fas fa-edit"></i></a>
                                                <a href="{{ url_for('delete_content', id=content.id) }}" class="btn btn-xs btn-danger" onclick="return confirm('Are you sure you want to delete this content?')"><i class="fas fa-trash"></i></a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<script src="{{ url_for('static', filename='AdminLTE-3.2.0/plugins/jquery/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='AdminLTE-3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='AdminLTE-3.2.0/dist/js/adminlte.min.js') }}"></script>
<script>
function generateDummy() {
    fetch('/contents/generate_dummy', {method: 'POST'}).then(() => location.reload());
}

$('#searchInput, #platformFilter, #statusFilter').on('input change', function() {
    var search = $('#searchInput').val().toLowerCase();
    var platform = $('#platformFilter').val();
    var status = $('#statusFilter').val();
    $('table tbody tr').each(function() {
        var row = $(this);
        var text = row.text().toLowerCase();
        var rowPlatform = row.find('td:eq(1)').text();
        var rowStatus = row.find('td:eq(2)').text();
        var show = true;
        if (search && text.indexOf(search) === -1) show = false;
        if (platform && rowPlatform !== platform) show = false;
        if (status && rowStatus !== status) show = false;
        row.toggle(show);
    });
});
</script>
</body>
</html>
